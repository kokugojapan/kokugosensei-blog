name: Deploy Astro site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          node-version: 22.23.4
      - name: Check generated content and tracking
        run: node scripts/check-aio.mjs && node scripts/check-outbound-tracking.mjs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 公開後に、このpushで追加・変更した記事のURLを IndexNow（Bing ほか）へ通知する。
  # 失敗してもデプロイは成功扱いのまま。
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Notify IndexNow
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          KEY: a074886c7a35d5fe53f2ee568ee4f4c1
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="$AFTER^"; fi
          slugs=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- 'src/content/blog/*.md' | sed 's|src/content/blog/||; s|\.md$||')
          if [ -z "$slugs" ]; then echo "変更記事なし"; exit 0; fi
          urls=$(printf '%s\n' $slugs | sed 's|.*|"https://blog.kokugosensei.com/blog/&/"|' | paste -sd, -)
          body="{\"host\":\"blog.kokugosensei.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://blog.kokugosensei.com/$KEY.txt\",\"urlList\":[$urls]}"
          echo "$body"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data "$body")
          echo "IndexNow HTTP $code"
          case "$code" in 200|202) ;; *) exit 1 ;; esac
